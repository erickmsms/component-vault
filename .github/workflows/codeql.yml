name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Toda segunda-feira, para pegar vulnerabilidades novas em código que não mudou
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  analise:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: "/language:javascript-typescript"
