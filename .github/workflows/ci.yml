name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checagens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Falha se uma dependência de produção tiver vulnerabilidade alta ou crítica conhecida
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run check:previews
      - run: npm run build
